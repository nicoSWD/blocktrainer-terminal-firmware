; Custom firmware for the Blocktrainer BT Clock / BT Terminal (ESP32-S3, 3.5" touch LCD).
; Built against the same toolchain as the stock image (ESP-IDF 4.4.x) so the stock
; bootloader and partition table stay valid. Do not bump the platform without re-checking that.

[env:wt32-sc01-plus]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@6.21.6
    lvgl/lvgl@~8.3.11
    fastled/FastLED@3.6.0

monitor_speed = 115200

; Same firmware with serial logging forced on (the stored "debug" setting is off by default).
; Use it for the first flash: `pio run -e debug`.
[env:debug]
extends = env:wt32-sc01-plus
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DFORCE_DEBUG=1

; Networking only: no display, sound or LED code runs (safe mode forced), logging on, /update enabled.
; First flash this one to prove Wi-Fi and OTA before the UI is involved: `pio run -e safe`.
[env:safe]
extends = env:debug
build_flags =
    ${env:debug.build_flags}
    -DFORCE_SAFE_MODE=1
