; BT Terminal / BT Clock firmware reconstruction
; ESP32-S3 (WT32-SC01 Plus class board), Arduino + LVGL 8 on a LovyanGFX panel driver.
; The environment name matches the one embedded in the firmware's library paths
; (".pio/libdeps/wt32-sc01-plus/...").

[env:wt32-sc01-plus]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; versions pinned from strings in the image: ArduinoJson "V6216PB2" = 6.21.6,
; LVGL 8.x (custom fonts use lv_font_fmt_txt, style property ids match 8.3).
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@6.21.6
    lvgl/lvgl@~8.3.11

monitor_speed = 115200
